openapi: 3.1.0
info:
  title: gosidian REST API
  version: "v1"
  description: |
    REST/JSON API consumed by the gosidian Vue 3 SPA (v2.0). Audience is
    the browser; the parallel MCP transport (`/mcp/sse`) covers agents.

    Auth: every endpoint outside the `public` tag requires a Bearer
    token in the `Authorization` header. Tokens are issued by
    `POST /api/v1/login` and managed by an SPA-specific token store
    distinct from the long-lived MCP token surface.

    Phase status: this spec is grown phase by phase together with
    handler implementations. Endpoints whose body is not yet wired
    return `501 Not Implemented` with `error.code = server.unavailable`
    so the SPA can render a "feature coming soon" state without
    special-casing each fetch.
  contact:
    name: gosidian
    url: https://github.com/daniele-chiappa/gosidian
  license:
    name: MIT

servers:
  - url: /
    description: same-origin

tags:
  - name: public
    description: No authentication required.
  - name: auth
    description: Session lifecycle for the SPA.
  - name: meta
    description: Build/version/capability discovery.
  - name: notes
    description: Note CRUD and read-side helpers.
  - name: projects
  - name: tags
  - name: search
  - name: graph
  - name: tree
  - name: settings
  - name: admin
  - name: trash
  - name: history
  - name: events
  - name: pipelines
    description: |
      Pipelines and their runs (IMP-166, docs/pipelines.md). 404 while the
      server runs no pipelines ([pipelines] enabled off).
  - name: in
    description: The IN folders of the projects (IMP-172, docs/in.md).

# ---------------------------------------------------------------------------
# Reusable schemas
# ---------------------------------------------------------------------------

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: gsp_<base64url>
      description: |
        Bearer token issued by `POST /api/v1/login`. Sliding TTL 24h
        (`webauth.session_ttl`), absolute hard expiry 7d
        (`webauth.session_max_ttl`) by default. Refresh via
        `POST /api/v1/refresh` before `expires_at`, which is never past
        `hard_expiry`; full re-login required after the hard expiry
        regardless of refresh activity.

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable dotted identifier consumed by the SPA i18n layer.
          examples: ["auth.invalid_credentials", "concurrency.etag_mismatch"]
        message:
          type: string
          description: Developer-readable English fallback. Not for end-user display.
        details:
          type: object
          additionalProperties: true
        trace_id:
          type: string
          description: Best-effort request id; empty in dev.

    Role:
      type: string
      enum: [owner, member]

    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        totp_enrolled:
          type: boolean
        recovery_codes_remaining:
          type: integer
          description: Unused recovery codes. Present only when two-factor is enrolled.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        totp:
          type: string
          description: >-
            Second factor, required when the account has two-factor enabled:
            a six-digit TOTP code, or one of the account's single-use recovery
            codes (xxxxx-xxxxx; case and dashes are ignored).

    LoginResponse:
      type: object
      required: [token, expires_at, hard_expiry, user]
      properties:
        token:
          type: string
          description: Bearer plaintext. Shown once; the SPA persists it in localStorage.
        expires_at:
          type: string
          format: date-time
        hard_expiry:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        totp_enrollment_required:
          type: boolean
          description: >-
            The effective policy mandates two-factor but no secret is enrolled:
            every route outside the enrolment flow answers 403
            auth.enrollment_required until /totp/confirm succeeds.
        recovery_code_used:
          type: boolean
          description: This login consumed a recovery code instead of a TOTP.

    TotpEnrollResponse:
      type: object
      required: [secret, otpauth_uri, qr_svg]
      properties:
        secret:
          type: string
          description: Candidate base32 secret; not active until confirmed.
        otpauth_uri:
          type: string
        qr_svg:
          type: string
          description: Inline SVG of the otpauth URI; empty if rendering failed.

    TotpConfirmRequest:
      type: object
      required: [secret, code]
      properties:
        secret:
          type: string
        code:
          type: string

    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A current six-digit TOTP code.

    RecoveryCodesResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: Single-use codes, shown once; the server keeps only hashes.

    RefreshResponse:
      type: object
      required: [token, expires_at, hard_expiry]
      properties:
        token:
          type: string
          description: Same plaintext as the request — refresh extends the sliding window without rotating the value.
        expires_at:
          type: string
          format: date-time
        hard_expiry:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required: [username, password, invite]
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 8
        invite:
          type: string
          description: Single-use registration token issued by an owner.

    VersionResponse:
      type: object
      required: [version, api]
      properties:
        version:
          type: string
        api:
          type: string
        build_time:
          type: string
          format: date-time
        commit:
          type: string

    NoteCommit:
      type: object
      required: [sha, short_sha, author, date, subject, path]
      properties:
        sha: {type: string}
        short_sha: {type: string}
        author:
          type: string
          description: '`name <email>`: who wrote the note, with the configured email.'
        date: {type: string, format: date-time}
        subject:
          type: string
          description: 'What was done, e.g. `update notes/plan.md`; `auto: <date>` for what no write of gosidian names.'
        path: {type: string, description: The note's path in this commit.}
        from: {type: string, description: The path before, in the commit that renamed the note; only when the principal can read it.}

    TreeNode:
      type: object
      required: [name, path, is_dir, kind]
      properties:
        name: {type: string, description: "The file or folder name."}
        path: {type: string}
        title: {type: string, description: "A note's title, where it is not its file name without its extension."}
        is_dir: {type: boolean}
        is_project_root: {type: boolean}
        kind: {type: string, description: "folder, in, or the kind of a note: note, plan, skill, memory, agent, doc, index, base, canvas."}
        note_count: {type: integer, description: "A folder's notes, at every depth."}
        in_progress: {type: boolean, description: "The note is tagged status:in-progress."}
        hidden_from_mcp: {type: boolean}
        skip_git_sync: {type: boolean}
        in: {type: object, description: "What the IN folder holds: files, bytes, new, working, errors."}
        children:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
    HealthResponse:
      type: object
      required: [api, status]
      properties:
        api:
          type: string
          example: v1
        status:
          type: string
          example: ok
        sse_subs:
          type: integer

    I18nCatalog:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: object
            additionalProperties: true
      description: |
        Nested JSON catalog. The exact shape mirrors the on-disk
        `internal/i18n/catalogs/ui.<lang>.json`; the SPA loads it as-is
        into vue-i18n.

  parameters:
    Lang:
      name: lang
      in: query
      schema:
        type: string
        pattern: ^[a-z]{2}$
      description: Two-letter locale code; defaults to the configured server locale.

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Token valid but role/scope insufficient.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: Endpoint is reserved by the spec but not yet wired in this build.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

# Default security: bearer required unless overridden per-operation.
security:
  - bearer: []

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------

paths:

  # -------------------------------- public ----------------------------------

  /api/v1/health:
    get:
      tags: [public, meta]
      security: []
      summary: Liveness probe.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/version:
    get:
      tags: [public, meta]
      security: []
      summary: Build metadata.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/i18n:
    get:
      tags: [public, meta]
      security: []
      summary: Localized UI catalog.
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/I18nCatalog"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/login:
    post:
      tags: [public, auth]
      security: []
      summary: Authenticate and issue a Bearer SPA token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials or missing/wrong TOTP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate-limited (too many failed attempts from this IP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/signup:
    post:
      tags: [public, auth]
      security: []
      summary: Redeem an invite token to create a new member account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid invite token, weak password, or duplicate username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/events:
    get:
      tags: [public, events]
      security: []
      summary: |
        Server-Sent Events stream for live updates.

        EventSource cannot send custom headers, so the session travels in
        the `gosidian_events` cookie (HttpOnly, path `/api/v1/events`)
        that login sets and every authenticated call re-issues; everything
        else mirrors a normal authenticated request. Reconnect with
        `Last-Event-ID` is supported but no historical events are
        replayed; the SPA refetches affected resources via REST after
        reconnect.
      parameters:
        - in: cookie
          name: gosidian_events
          required: false
          schema:
            type: string
          description: The SPA session token, set by POST /api/v1/login.
        - in: query
          name: token
          required: false
          deprecated: true
          schema:
            type: string
          description: |
            The SPA session token, for clients from before the cookie
            (accepted for one release). It reaches proxy access logs: do
            not use it.
        - in: query
          name: topics
          required: false
          schema:
            type: string
          description: Comma-separated topics to subscribe to. Empty = all.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

  # ----------------------------- authenticated ------------------------------

  /api/v1/me:
    get:
      tags: [auth]
      summary: Current authenticated user.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/password:
    post:
      tags: [auth]
      summary: Change the caller's own password.
      description: >-
        Local accounts only (an LDAP account's password is the directory's).
        The other web sessions of the account are closed, the current one
        stays; MCP tokens stay. It clears the obligation to change a password
        the owner chose (403 auth.password_change_required on every other
        route until then).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions_closed: { type: integer }
        "400":
          description: Missing field, too short, same as the current one, or an LDAP account.
        "403":
          description: Wrong current password.
        "429":
          description: Too many wrong passwords.

  /api/v1/totp/enroll:
    post:
      tags: [auth]
      summary: Start two-factor enrolment — a candidate secret plus its otpauth URI and QR.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The account has two-factor already; DELETE /api/v1/totp, with the password, comes first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/totp/confirm:
    post:
      tags: [auth]
      summary: Activate the candidate secret by proving a current code; issues the recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpConfirmRequest"
      responses:
        "200":
          description: Secret active; the account's single-use recovery codes, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "400":
          description: Invalid code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The account has two-factor already; the secret is not replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/totp/recovery-codes:
    post:
      tags: [auth]
      summary: Replace every recovery code with a fresh set (requires a current TOTP code).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "400":
          description: Invalid code (counts against the account's second-factor limiter).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Two-factor is not enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many failed second-factor attempts for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/totp:
    delete:
      tags: [auth]
      summary: Remove the caller's TOTP secret and recovery codes.
      description: >-
        Needs the current password: a stolen session alone must not take the
        second factor away. A wrong password answers 403 and counts against
        the account's limiter like a failed login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204":
          description: Removed.
        "400":
          description: The password is missing.
        "403":
          description: The effective policy requires two-factor for this account, or the password is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/refresh:
    post:
      tags: [auth]
      summary: Extend the sliding TTL of the current token.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/logout:
    post:
      tags: [auth]
      summary: Revoke the current token.
      responses:
        "204":
          description: revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---- placeholder paths reserved for subsequent v2.0 phases ---------------
  # Each currently returns 501. The spec carries them so the SPA fetch
  # client + types.gen.ts know the contract surface from day one and the
  # CI drift check (scripts/check-openapi-drift.sh) catches accidental
  # divergence.

  /api/v1/notes:
    get:
      tags: [notes]
      summary: List notes (Phase 1 follow-up).
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [notes]
      summary: Create a note (Phase 1 follow-up).
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/notes/{path}/history:
    get:
      tags: [history]
      summary: The commits of a note, newest first (git sync on).
      description: >-
        `git log --follow`: a renamed note has its commits under the name it
        had then, in path. The commits the note had in a project the
        principal cannot read are left out, and the subject of its move
        from there does not name it. A commit is made in the name of who
        wrote the note, its subject says what was done (IMP-222).
      parameters:
        - in: path
          name: path
          required: true
          schema: {type: string}
          description: The note's vault path, e.g. `notes/plan.md`.
        - in: query
          name: limit
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200":
          description: The commits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NoteCommit"
                  total: {type: integer}
                  limit: {type: integer}
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Git sync off.

  /api/v1/notes/{path}/history/{sha}:
    get:
      tags: [history]
      summary: A version of a note and the diff to the note now (IMP-222).
      description: >-
        The note as the commit sha of its history held it, under the name
        it had then, and the unified diff from it to the note as it is now
        (its hunks, without a header). A version over 1 MiB, or the note
        now over it, gives neither, nor one that is not text, nor the
        commit that deleted the note: omitted says why.
      parameters:
        - in: path
          name: path
          required: true
          schema: {type: string}
        - in: path
          name: sha
          required: true
          schema: {type: string, pattern: "^[0-9a-f]{7,64}$"}
          description: A commit of the note's history, its full hash or at least 7 of its first digits.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NoteCommit"
                  - type: object
                    required: [same]
                    properties:
                      content: {type: string, description: The note's text then.}
                      diff: {type: string, description: From that version to the note now; empty when the same.}
                      same: {type: boolean}
                      omitted:
                        type: string
                        enum: [deleted, too_large, not_text]
                      etag: {type: string, description: The note's etag as the diff read it, the if_match of a restore from it.}
        "404":
          description: No such note, or the sha is no version of it, or the version is in a project the principal cannot read.
        "503":
          description: Git sync off.

  /api/v1/notes/{path}/versions:
    get:
      tags: [history]
      summary: The note's tags and its valid version (IMP-201).
      description: >-
        The tags on the commits of the note's history, newest first, those
        that name the note and those that name no note, as a pipeline's. Tags
        on versions in a project the reader cannot see are left out.
        `can_admin` says the reader may change them.
      parameters:
        - in: path
          name: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The tags, `valid`, `mcp` and `can_admin`.
        "404":
          description: No such note, or not readable.
        "503":
          description: Git sync is off.
    post:
      tags: [history]
      summary: Name a version of the note (IMP-201).
      description: >-
        An annotated tag `note/<path>/<label>` on a commit of the note's
        history, in the name of who asked, or on the note as it is, after
        committing what is pending. For the project's admin. The same label
        on the same version is the tag already there.
      parameters:
        - in: path
          name: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: {type: string, description: "What people call the version: V3."}
                sha: {type: string, description: The version; none for the note as it is.}
                message: {type: string, description: What the tag says.}
      responses:
        "201":
          description: The tag, and whether the push went.
        "403":
          description: Not the project's admin.
        "404":
          description: The version is not one of the note.
        "409":
          description: The label is on another version; a tag never moves.
        "422":
          description: No tag can have that label.
        "503":
          description: Git sync is off.
  /api/v1/notes/{path}/valid:
    put:
      tags: [history]
      summary: Choose the version readers must see (IMP-201).
      description: >-
        Writes `valid_version` in the note's frontmatter, the one way to
        change it: any other write leaves it as it was. The note as it is
        stays the draft, and `GET /notes/{path}` gives it with `valid`, or
        the version with `?version=valid`. Committed at once in the admin's
        name. For the project's admin.
      parameters:
        - in: path
          name: path
          required: true
          schema: {type: string}
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
          description: The note's etag; if_match in the body does the same.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: {type: string, description: "A tag of the note, whole or by its label."}
                if_match: {type: string, description: The etag of the note as the client read it.}
      responses:
        "200":
          description: The note, with `valid`.
        "403":
          description: Not the project's admin.
        "404":
          description: No such tag on the note's versions.
        "412":
          description: The note changed since it was read.
        "422":
          description: The note cannot hold the key, as a frontmatter not closed.
        "503":
          description: Git sync is off.
    delete:
      tags: [history]
      summary: Remove the valid version (IMP-201).
      description: Every reader sees the note as it is again. For the project's admin.
      parameters:
        - in: path
          name: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The note.
        "403":
          description: Not the project's admin.
        "503":
          description: Git sync is off.
  /api/v1/notes/{path}/mcp-version:
    put:
      tags: [history]
      summary: Choose the version who calls over MCP reads (IMP-228).
      description: >-
        Writes `mcp_version` in the note's frontmatter, the one way to change
        it. Without the key they read the note as it is. Every write goes on
        to the note as it is. Committed at once in the admin's name. For the
        project's admin.
      parameters:
        - in: path
          name: path
          required: true
          schema: {type: string}
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
          description: The note's etag; if_match in the body does the same.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: {type: string, description: "A tag of the note, whole or by its label, or `valid` to follow the valid version."}
                if_match: {type: string, description: The etag of the note as the client read it.}
      responses:
        "200":
          description: The note, with `mcp`.
        "403":
          description: Not the project's admin.
        "404":
          description: No such tag on the note's versions.
        "412":
          description: The note changed since it was read.
        "422":
          description: The note cannot hold the key, as a frontmatter not closed.
        "503":
          description: Git sync is off.
    delete:
      tags: [history]
      summary: Remove the choice (IMP-228).
      description: Who calls over MCP reads the note as it is again. For the project's admin.
      parameters:
        - in: path
          name: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The note.
        "403":
          description: Not the project's admin.
        "503":
          description: Git sync is off.
  /api/v1/notes/{path}/restore:
    post:
      tags: [history]
      summary: Write a version of the note back, and commit it at once (IMP-222).
      description: >-
        The text of the version sha, written at the note's path today as a
        save writes it: the index, the event an open editor sees, the audit
        log with the action restore (To the commit). Then a commit at once in
        the writer's name, `restore <path> to <sha7>`, the top of the
        history. A version the same as the note writes nothing (restored
        false). For who may write the note.
      parameters:
        - in: path
          name: path
          required: true
          schema: {type: string}
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
          description: The note's etag; if_match in the body does the same.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha]
              properties:
                sha: {type: string, description: The version, a commit of the note's history.}
                if_match: {type: string, description: The etag of the note as the client read it.}
      responses:
        "200":
          description: Restored, or the same already.
          content:
            application/json:
              schema:
                type: object
                required: [restored, note]
                properties:
                  restored: {type: boolean}
                  note: {type: object, description: "The note as GET /api/v1/notes/{path} gives it."}
                  commit:
                    $ref: "#/components/schemas/NoteCommit"
                  commit_error:
                    type: string
                    description: Why the commit failed; the note is restored, and the next debounced commit takes it.
        "400":
          description: No sha.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such note, or the sha is no version of it, or the version is in a project the principal cannot read.
        "412":
          description: The note changed since the client read it; details.current_etag is its etag now.
        "422":
          description: The version deleted the note, or is over 1 MiB.
        "503":
          description: Git sync off.

  /api/v1/preview:
    post:
      tags: [notes]
      summary: Render markdown to sanitized HTML (Phase 1 follow-up).
      description: |
        With `cut` (`{collection?, max_chars?, context?, media_words?, inline_max_side?, media_paragraphs?, icon_descriptions?}`)
        it answers the cut view instead (IMP-170, docs/web-ui/overview.md): the
        note as the `note.sections` node cuts it, `{cut: {blocks: [{id, parent,
        level, section, chars, hash, part, over, state, head, html}], sections,
        paragraphs, media, max_chars, collection, stored, orphans, states, error}}`.
        Against a `collection` (`<plugin>/<collection>` of an archive exposed in
        the project) each block's `state` is `same`, `changed` or `missing`; a
        collection that cannot be read gives `error` and no states. The note
        must be a markdown note the reader may read (400 otherwise).
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/cut/collections:
    get:
      tags: [notes]
      summary: The collections the cut view can compare a note with.
      description: |
        The collections of the archives exposed in `project` whose `list` and
        `collections` are read tools, for a reader of the project.
      parameters:
        - {name: project, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: "`{project, collections: [{source, plugin, collection, model, count}], problems: [string]}`; `problems` names the archives that did not answer."

  /api/v1/marks:
    get:
      tags: [notes]
      summary: The marks the pipelines put on a note (IMP-188).
      parameters:
        - {name: path, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: "`{path, sets: [{set, pipeline, run, created, stale, marks: [{base, section, block, color, label, text}]}]}`; `stale` when the set was made on another text of the note."
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/note-titles:
    get:
      tags: [notes]
      summary: Notes by name, for the wikilink suggestions of the editor and of a relation field.
      description: >-
        With q, the notes the account can read whose title or file name (the
        last part of the path, without its extension) contains q, ignoring
        case; the body does not count. A title that starts with q comes
        first, then a file name that starts with it, then a title that
        contains it, then a file name; within each, by title and path.
        Without q, the notes edited last.
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: The notes, best first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [title, path]
                      properties:
                        title: {type: string}
                        path: {type: string}

  /api/v1/tree:
    get:
      tags: [tree]
      summary: The sidebar tree, the folders and notes the account can read.
      description: >-
        One node per folder and note, folders first, then by name. A note
        has title where its title, the frontmatter's, is not its file name
        without its extension, so the row can show it. A project root has
        its flags; a project with use_in has its IN folder first, as one
        node with what it holds.
      parameters:
        - in: query
          name: project
          required: false
          description: Only that project's subtree, still under the root.
          schema:
            type: string
      responses:
        "200":
          description: The tree from its root.
          content:
            application/json:
              schema:
                type: object
                properties:
                  root:
                    $ref: "#/components/schemas/TreeNode"

  /api/v1/folders/{path}/export.zip:
    get:
      tags: [tree]
      summary: Zip of a folder (the tree's context menu).
      description: >-
        Every file under the folder, as the project export: hidden files,
        node_modules and symlinks left out, names starting at the folder
        itself (docs/... for Work/a/docs). Any signed-in account that can
        read the project; 10 exports per 10 minutes per account, shared with
        the project and vault exports; audited as export.
      parameters:
        - in: path
          name: path
          required: true
          description: Vault-relative folder path; its slashes stay as they are.
          schema:
            type: string
      responses:
        "200":
          description: The zip, streamed.
          content:
            application/zip: {}
        "403":
          description: The anonymous guest of open mode.
        "404":
          description: Not a folder, or a project the account cannot read.
        "429":
          description: Over the export limit (Retry-After).

  /api/v1/folders/{path}:
    delete:
      tags: [tree]
      summary: Move a folder inside a project to the trash.
      description: >-
        The folder and all it holds become one trash entry, restored in one
        go from /api/v1/trash like a note: write access on the project. A
        project folder is deleted with DELETE /api/v1/projects/{name}.
        Audited as delete.
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trashed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trash_id: { type: string }
                  removed:
                    type: array
                    items: { type: string }
                    description: The notes the folder held, now out of the index.
        "400":
          description: A project folder, a hidden path, or a folder that is, holds or sits in the server's state directory.
        "403":
          description: No write access on the project.
        "404":
          description: Not a folder, or a project the account cannot read.
        "503":
          description: The trash is not enabled; a folder is never deleted for good this way.

  /api/v1/projects:
    get:
      tags: [projects]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/tags:
    get:
      tags: [tags]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/search:
    get:
      tags: [search]
      summary: Full-text search of the notes the account can read (the SPA's search).
      description: >-
        Ranked as memory_search ranks them. The notes with every word of q
        come first; when they are fewer than limit, the notes with one of
        its less common words (in at most 10% of the notes) follow them,
        each with the words it lacks in missing. Snippets are plain text.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Free-text query; each word is prefix-matched.
        - in: query
          name: project
          required: false
          schema:
            type: string
          description: Restrict the search to one top-level folder.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: The hits, best first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                      required: [path, title, snippet]
                      properties:
                        path: {type: string}
                        title: {type: string}
                        snippet: {type: string}
                        missing:
                          type: array
                          items: {type: string}
                          description: The words of q the note lacks; only on a partial hit.
        "400":
          description: No q.

  /api/v1/query:
    post:
      tags: [search]
      summary: Notes selected by their frontmatter (the MCP memory_query tool).
      description: >-
        Every condition must hold. A namespaced tag counts as a field when
        the note has none; ISO dates and numbers compare as such, text
        ignores case. A value written as a [[wikilink]] matches by link,
        and the pseudo-field links covers every link of a note (links
        contains [[p/x]]: what links to p/x); a link to no note the
        principal can see is a 400. Scoped to the projects the principal
        can read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project: {type: string}
                from:
                  type: array
                  items: {type: string}
                  description: "Folders whose notes directly inside are queried (a database's rows); with it, where may be empty."
                where:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [field]
                    properties:
                      field: {type: string}
                      op: {type: string, enum: [eq, ne, in, exists, lt, lte, gt, gte, contains]}
                      value: {description: "String, number, list (in) or boolean (exists)."}
                sort: {type: string, description: "A field, or path, title, modified (default)."}
                order: {type: string, enum: [asc, desc]}
                fields: {type: array, items: {type: string}}
                limit: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200":
          description: Matching notes, sorted and cut at limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        path: {type: string}
                        title: {type: string}
                        modified: {type: string, format: date-time}
                        fields: {type: object, additionalProperties: true}
                  count: {type: integer}
                  total: {type: integer}
                  truncated: {type: boolean}
        "400":
          description: Invalid query (unknown operator, missing value, bad order…).

  /api/v1/graph:
    get:
      tags: [graph]
      summary: Force-directed graph payload (Phase 5).
      description: |
        Without `limit` it keeps the 2000 most linked nodes (and the focus);
        `stats.total` is how many there were (docs/vault/graphs.md). With
        `source=<plugin>/<graph>` it is a plugin's graph: a graph the plugin
        answers with an error of its own (its arguments refused, its store
        failing) is a 422 with code `plugin.refused` and the plugin's message.
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/command-palette:
    get:
      tags: [search]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/upload:
    post:
      tags: [notes]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/attach:
    post:
      tags: [notes]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/settings:
    get:
      tags: [settings]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      tags: [settings]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/trash:
    get:
      tags: [trash]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/admin/tokens:
    get:
      tags: [admin]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/admin/users:
    get:
      tags: [admin]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/admin/users/{id}/password:
    post:
      tags: [admin]
      summary: Set another account's password, temporary (owner-only).
      description: >-
        Confirmed with the owner's own password. The account must change it
        at its next request (password_change_required), and its web sessions
        and OAuth grants are closed (sessions_closed, grants_closed). Audited
        as password_reset. The owner changes its own password with
        /api/v1/me/password.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, owner_password]
              properties:
                password: { type: string, minLength: 8 }
                owner_password: { type: string }
      responses:
        "200":
          description: Reset.
        "400":
          description: Too short, the owner's own account, a disabled or an LDAP account.
        "403":
          description: Wrong owner password, or not the owner.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/{id}/totp:
    delete:
      tags: [admin]
      summary: Clear a user's TOTP secret and recovery codes (owner-only; lost authenticator).
      description: >-
        Policy and sessions are untouched: under a required policy the user
        re-enrols at the next login. Audited as totp_reset. Refused (403) on
        the owner's own account, whose two-factor comes off from
        DELETE /api/v1/totp, with the password; so is a PATCH that sets the
        owner's own totp_policy to disabled.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reset.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/audit:
    get:
      tags: [admin]
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/pipelines:
    get:
      tags: [pipelines]
      summary: The pipelines of the projects the caller reads.
      parameters:
        - {name: project, in: query, schema: {type: string}}
      responses:
        "200":
          description: "`{pipelines: [{path, title, project, trigger, nodes, problem, last_run}]}`"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pipeline-nodes:
    get:
      tags: [pipelines]
      summary: The node types of the pipelines, with the JSON Schemas of their settings and output.
      description: |
        For the pipeline editor of the web UI (IMP-169). Answers with the
        pipelines off too: then only the base node types. A plugin's nodes
        are those of its accepted manifest, with its status; their output
        schema has the `files` the node gives back. `format` in a text
        setting tells how to edit it: multiline, code, path, attachment,
        duration.
      responses:
        "200":
          description: "`{pipelines_enabled, nodes: [{type, group (base or the plugin), description, status, files, input_schema, output_schema}]}`"

  /api/v1/pipeline-check:
    post:
      tags: [pipelines]
      summary: Whether the server would run a ```pipeline block, and why not.
      description: |
        The checks of a pipeline note (`pipeline-invalid`) on a block not
        saved yet: its YAML, trigger, node types, ids, after and references.
        Answers with the pipelines off too, against the base node types.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: {type: string, description: "The YAML of the block, 256 KiB at most."}
      responses:
        "200":
          description: "`{ok: true}`, or `{ok: false, problem}`"
        "413":
          description: The block is larger than 256 KiB.

  /api/v1/attachments:
    get:
      tags: [notes]
      summary: The attachments of a project, for a picker.
      description: "To who may read the project, newest first; `kind=image` keeps the images. A page layout's window picks the pictures it places among them (docs/vault/layouts.md)."
      parameters:
        - {name: project, in: query, required: true, schema: {type: string}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [image]}}
      responses:
        "200":
          description: "`{attachments: [{path, size, modified, image}]}`"
        "400":
          description: No project.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/layouts/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string}
        description: "The vault path of a markdown note."
    get:
      tags: [notes]
      summary: The design of a note, as the editor's package.
      description: |
        docs/vault/layouts.md. Each asset has the bytes of its link when the
        reader may read it; the others are named in `Gosidian-Layout-Missing`.
      responses:
        "200":
          description: "The package, `application/vnd.designcraft+zip`, with the design's `ETag`."
        "204":
          description: |
            The note has no design yet. `Gosidian-Layout-Page` and
            `Gosidian-Layout-Template`, path-escaped, say what its frontmatter
            names for the design to start from: a page (`A5`, `148x210mm`) and
            another layout note (IMP-232).
        "400":
          description: The path is no markdown note.
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The file `layout_file` names does not read.
    put:
      tags: [notes]
      summary: Save the editor's package into attachments the note names.
      description: "`If-Match` the design's etag, from `GET`. The body is the package."
      responses:
        "200":
          description: "`{path, etag: the design's, file, assets: {<id>: <attachment>}, preview}`"
        "400":
          description: Not a package, an entry it should not have, a document that does not read.
        "412":
          description: The design was saved since it was opened.
        "413":
          description: Past `[web] layout_max_bytes`.
        "422":
          description: A file the attachments do not take.

  /api/v1/layouts/{path}/pieces:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [notes]
      summary: The pieces of a note's text, which its design places.
      responses:
        "200":
          description: "`{path, etag, pieces: [{n, kind, text, hash, line, blocks, excluded?, duplicate?, image?}]}`"
        "400":
          description: The path is no markdown note.
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [notes]
      summary: Add a piece to the note, a text or an image, after a piece, before them all or at its end.
      description: "The body is `{after?, text}` or `{after?, image, alt?}`: `after` is the piece it follows, -1 before every piece, 0 or none at the end."
      responses:
        "200":
          description: "`{path, etag, pieces, added}`"
        "400":
          description: Neither or both, or an image that is no attachment the reader may read.

  /api/v1/layouts/{path}/pieces/number:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [notes]
      summary: Number the blocks without a comment, every one or those of a piece.
      description: "`If-Match` the note's etag. The body is `{}` or `{n: <a piece>}`."
      responses:
        "200":
          description: "`{path, etag, pieces}`, as they are now."
        "400":
          description: A body that does not read, or a number below 0.
        "412":
          description: The note changed since it was read.

  /api/v1/layouts/{path}/pieces/edit:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [notes]
      summary: Write a new text for a piece of the note (IMP-228).
      description: >-
        The body is `{n, hash, text}`: its number, its hash as it was read, its
        new markdown. Only that stretch of the note changes. An image among
        other blocks comes apart from them, each its own piece, the first
        keeping the number.
      responses:
        "200":
          description: "`{path, etag, pieces}`, as they are now."
        "400":
          description: A body that does not read.
        "403":
          description: Who cannot write the project.
        "409":
          description: The piece changed since it was read, or left the note.
        "422":
          description: No text.

  /api/v1/layouts/{path}/pieces/reorder:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [notes]
      summary: Write the numbered pieces of the note in another order (IMP-231).
      description: >-
        The body is `{"order": [{n, hash}, …]}`: each numbered piece of the
        note once, with its hash as it was read. Each piece moves with its
        comment and its blocks, and keeps its number, so the frames that show
        it still do. What stands before the first comment stays first; a
        number written again follows the first piece that has it.
      responses:
        "200":
          description: "`{path, etag, pieces}`, as they are now."
        "400":
          description: A body that does not read, or an order that does not name each numbered piece once.
        "403":
          description: Who cannot write the project.
        "409":
          description: A piece changed since it was read, or left the note.

  /api/v1/layouts/{path}/export:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string}
      - name: name
        in: query
        required: true
        schema: {type: string}
        description: The exported file's name, a .pdf.
      - name: version
        in: query
        required: false
        schema: {type: string}
        description: >-
          A tag of the note (`note/<path>/V3`): the PDF of that version, kept
          by its label beside the others. Without it, the draft's, which takes
          the place of the draft's before.
    post:
      tags: [notes]
      summary: Keep a PDF an app wants beside the note, named in layout_pdfs.
      description: >-
        The note lists its PDFs in `layout_pdfs`, each item `label: path`
        (`V3: …`, `draft: …`); an older `layout_pdf` goes into the list as
        the draft's. Write on the note's project, as a save of the design.
      responses:
        "200":
          description: "`{path, label, note, etag}`"
        "400":
          description: No name, not a .pdf, or `version=valid`, which is no tag.
        "404":
          description: A version the note does not have.
        "422":
          description: Bytes that are no PDF, or past an attachment's 10 MiB.
        "503":
          description: A version asked while git sync is off.

  /api/v1/plugins/apps:
    get:
      tags: [pipelines]
      summary: The apps of the accepted manifests, for the windows that open them.
      description: |
        Every signed-in account while the pipelines are on (docs/plugins.md, Apps).
        An app is a page gosidian frames for the notes of a type; `origin` is
        the one its messages must come from. `alt_urls`, when present, are the
        same page at other addresses: a client opens the one on the host it
        reached gosidian at, and takes messages from that one's origin.
      responses:
        "200":
          description: "`{apps: [{plugin, name, title, description, url, alt_urls, origin, note_type, bridge, engine, status}]}`"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/plugins:
    get:
      tags: [pipelines]
      summary: The plugins of the pipelines, their status and node types.
      description: |
        Every signed-in account while the pipelines are on (docs/plugins.md).
        Only the owner gets `url` and `error`, which name hosts of the network.
      responses:
        "200":
          description: "`{plugins: [{name, status (ok, unaccepted, changed, down, unknown), version, sha, nodes: [{type, description}], sources: [{name, kind, description, changes, move}], accepted: {version, sha, at, by}, checked, error, url}]}`"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pipelines/{path}/runs:
    get:
      tags: [pipelines]
      summary: The runs of one pipeline, newest first.
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}, description: "The pipeline note, vault-relative, slashes kept (team/pipelines/arrivals.md)."}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
      responses:
        "200":
          description: "`{pipeline, runs: [...]}`"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [pipelines]
      summary: Start the pipeline.
      description: |
        With a session with write access on the project (trigger manual), or
        with a run token (`Authorization: Bearer gosidian_run_…`, from
        `gosidian pipeline token create`), which starts this pipeline only,
        when it starts on external or manual (trigger external), at most 60
        times a minute. The same idempotency key (in the body or the
        `Idempotency-Key` header) gives back the run it started, with 200.
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input: {type: object, description: "What the nodes read as trigger. Files by their vault path."}
                idempotency_key: {type: string}
                callback_url: {type: string, description: "POSTed the run's summary when it ends; only [pipelines] http_allowlist."}
      responses:
        "202":
          description: "Queued: `{run, existing: false}`"
        "200":
          description: "The run of this idempotency key: `{run, existing: true}`"
        "400":
          description: The input or the pipeline is wrong, or it does not start from outside.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The project does not run pipelines (use_pipelines off).
        "429":
          description: Too many starts with this run token.

  /api/v1/runs:
    get:
      tags: [pipelines]
      summary: The runs of the projects the caller reads.
      parameters:
        - {name: project, in: query, schema: {type: string}}
        - {name: pipeline, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [queued, running, waiting, done, failed, canceled]}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
      responses:
        "200":
          description: "`{runs: [...]}`"

  /api/v1/runs/{id}:
    get:
      tags: [pipelines]
      summary: A run with its steps (outputs over 64 KiB cut).
      responses:
        "200":
          description: "`{run, steps: [{name, use, status, attempt, error, output, output_truncated, started, finished, wait_until}]}`"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/runs/{id}/resume:
    post:
      tags: [pipelines]
      summary: Hand data to the run's waiting step (wait.call).
      description: |
        With the run's key (`?key=`, the `{{ run.resume_url }}` a pipeline
        hands to a service) and no account, or with a session with write
        access. The body, any JSON value (empty: `{}`), becomes the step's
        output. The key works while the run waits, and for this run only.
      security: []
      parameters:
        - {name: key, in: query, schema: {type: string}}
        - {name: step, in: query, schema: {type: string}, description: "The waiting step, when more than one waits."}
      responses:
        "200":
          description: "`{run}`"
        "400":
          description: The body is not JSON, or more than one step waits.
        "404":
          description: No such run, or not its key.
        "409":
          description: The run is not waiting.

  /api/v1/runs/{id}/cancel:
    post:
      tags: [pipelines]
      summary: Stop the run (write access on the project).
      responses:
        "200":
          description: "`{run}`"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/run-files/{ticket}:
    get:
      tags: [pipelines]
      summary: A file a plugin node got by reference (file_refs).
      description: |
        No account: the ticket in the address, bound to the run and to the
        file, is the key, while the step may run; it goes when the run
        ends. Ranges and conditional requests work. Rate limited per ticket.
      security: []
      parameters:
        - {name: ticket, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The file's bytes, inert (a download).
        "206":
          description: A range of them.
        "404":
          description: No such ticket, an expired one, or one of a run that ended.
        "429":
          description: Too many requests for this ticket.

  /api/v1/in/{project}:
    get:
      tags: [in]
      summary: What a project's IN folder holds, a folder at a time.
      description: |
        Read access to a project with use_in. Without recursive, the
        subfolders of dir with what they hold, and a page of its files;
        with recursive=true, a page of the files under dir that the
        filters select.
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
        - {name: dir, in: query, schema: {type: string}, description: "A folder of the IN folder; empty for its root."}
        - {name: recursive, in: query, schema: {type: boolean}}
        - {name: match, in: query, schema: {type: string}, description: "A glob on the file name."}
        - {name: kinds, in: query, schema: {type: string}, description: "Extensions, comma-separated."}
        - {name: status, in: query, schema: {type: string, enum: [new, working, done, error, ignored]}}
        - {name: limit, in: query, schema: {type: integer, maximum: 5000}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: "`{project, root, dir, counts: {files, bytes, new, working, errors}, folders: [{path, files, bytes, new}], files: [{path, name, stem, ext, dir, size, modified, sha256, etag, status, run, source, batch, first_seen, updated}], next, sources: [{folder, plugin, source, kind, description, changes, move, write, status (ok, checking, error, off), error, checked, every}], track_in_git}`. A file of a source's folder has the source (`<plugin>/<source>`) in source, its etag, and its SHA-256 only when the source gives it."
        "400":
          description: A bad glob.
        "404":
          description: No such project, or it has no IN folder.

  /api/v1/in/{project}/move:
    post:
      tags: [in]
      summary: Move a file or a folder inside the IN folder (write access).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: {type: string, description: "Relative to the IN folder, or the vault path."}
                to: {type: string, description: "A path; one ending in / is a folder to move it into."}
      responses:
        "200":
          description: "`{path, from}`"
        "400":
          description: A path outside the IN folder, or through a link.
        "404":
          description: No such file.
        "409":
          description: The target is there; or a file of a source, which moves inside its source only, when it is bound with write and the source can move.

  /api/v1/in/{project}/status:
    post:
      tags: [in]
      summary: Set the status of files of the IN folder (write access).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths, status]
              properties:
                paths: {type: array, items: {type: string}}
                status: {type: string, enum: [new, working, done, error, ignored]}
      responses:
        "200":
          description: "`{updated}`"

  /api/v1/in/{project}/delete:
    post:
      tags: [in]
      summary: Delete files or folders of the IN folder (write access).
      description: Into the trash when it is on; a folder needs it, a file without it goes for good.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths: {type: array, items: {type: string}}
      responses:
        "200":
          description: "`{removed, trash}`"
        "409":
          description: A file of a source, which is not removed from gosidian.
        "503":
          description: A folder, and the trash is off.

  /api/v1/in/{project}/run:
    post:
      tags: [in]
      summary: Start a pipeline of the project on files of the IN folder (write access).
      description: |
        By hand, the way the pipeline's trigger would: an `in` pipeline per
        file gets one run per file it takes, with a file's trigger; an `in`
        pipeline per batch one run with the files it takes; any other
        pipeline one run with all the files. The trigger of a run with
        files has the shape of a batch's (`files`, `count`, `bytes`, `batch`
        empty). The files an `in` trigger does not take are skipped, with
        why. The files are marked working with their run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipeline, paths]
              properties:
                pipeline: {type: string, description: "The pipeline note, vault-relative."}
                paths: {type: array, items: {type: string}}
      responses:
        "202":
          description: "`{runs: [...], skipped: [{path, reason (folder, kinds, match), value, why}]}`"
        "404":
          description: The pipelines are off, or a path is no file of the IN folder.

  /api/v1/in/{project}/scan:
    post:
      tags: [in]
      summary: Check the IN folder now (write access).
      description: |
        The disk, and the sources bound to the project's IN folder: one
        folder's, or, without folder, all of them. The check runs in the
        background; the window hears of what changed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder: {type: string, description: "A source's folder, at the root of the IN folder; empty for all."}
      responses:
        "202":
          description: "`{project, folder}`"
        "400":
          description: folder names no folder at the root of the IN folder.

  /api/v1/in/{project}/uploads:
    get:
      tags: [in]
      summary: The uploads of the account into the IN folder, newest first (write access).
      description: Without their files; an upload's own GET has them. A done upload stays listed, with its results, until session_ttl after its end.
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: "`{uploads: [{id, project, dir, policy, owner, channel, state (open, completing, done), created, updated, expires, error, file_count, bytes, received, chunk_size, max_chunk, batches}]}`"
    post:
      tags: [in]
      summary: Open an upload into the IN folder (write access).
      description: |
        Lists the files of the upload, each with its path under dir and its
        size; a zip with unzip is unpacked on the server, into a folder of
        its own. The same account opening the same files into the same
        folder again gets the open upload back, with the bytes received:
        the way to resume after a reload. The caps of [in] (a file, an
        upload, the kinds, the IN folder) and the disk's reserve are checked
        here, on the sizes given. Then each file is sent in pieces (PUT),
        and the upload completed.
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                dir: {type: string, description: "A folder of the IN folder, made if missing; empty for its root."}
                policy: {type: string, enum: [replace, keep, skip], description: "For a file whose place is taken: replace (the old one into the trash), keep both (\"name (2).ext\"), skip. Default keep; the completion can change it."}
                files:
                  type: array
                  maxItems: 100000
                  items:
                    type: object
                    required: [path, size]
                    properties:
                      path: {type: string, description: "Relative to dir: no hidden, empty, . or .. segment, no \\, at most 1024 bytes."}
                      size: {type: integer, format: int64}
                      unzip: {type: boolean, description: "A .zip to unpack."}
                      modified: {type: integer, format: int64, description: "The time the file keeps, Unix milliseconds."}
      responses:
        "201":
          description: "The upload, with its files: `{…, files: [{n, path, size, unzip, modified, received, sha256, exists}]}`. exists: the file's place (a zip's folder) is taken."
        "400":
          description: A path no file can have, a folder of a source, a file named twice.
        "404":
          description: No such project, or it has no IN folder.
        "413":
          description: "Over a cap of [in]: code request.too_large."
        "507":
          description: "The disk would go under the reserve: code storage.full."

  /api/v1/in/{project}/uploads/{id}:
    get:
      tags: [in]
      summary: An upload, with its files and, once done, their results (write access).
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: files, in: query, schema: {type: boolean, default: true}, description: "false leaves the files out: the way to follow a completion."}
      responses:
        "200":
          description: "The upload. A file's result, once done: `{result (new, replaced, renamed, skipped, same, unzipped, dropped, error), path, error}`, a zip's with `counts` by result, `ignored` (folders, hidden files, links) and the first files `refused`, with why."
        "404":
          description: No such upload of the account in the project.
    delete:
      tags: [in]
      summary: Drop an open upload with what arrived, or forget a done one (write access).
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: "`{id, dropped: true}`"
        "409":
          description: The upload is completing.

  /api/v1/in/{project}/uploads/{id}/files/{n}:
    put:
      tags: [in]
      summary: A piece of a file of an open upload (write access).
      description: |
        The body is the bytes of file n from offset on, at most max_chunk
        (64 MiB) and no more than the file lacks; offset is at most the
        bytes received so far: the bytes the server has are skipped, so a
        piece sent again after a connection lost in its middle goes on
        where it stopped, and an offset past them answers 409. The piece is
        written to the disk, synced, and recorded with the state of the
        file's SHA-256 before the answer. A piece refused is read whole
        before the answer, so the client gets it while still sending.
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: n, in: path, required: true, schema: {type: integer}}
        - {name: offset, in: query, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: "`{n, received, size, sha256}`: sha256 once the file is whole."
        "409":
          description: "Another offset than the bytes received (`details.received` says them), or the upload is not open."
        "413":
          description: A piece over max_chunk.
        "507":
          description: "The disk would go under the reserve: code storage.full."

  /api/v1/in/{project}/uploads/{id}/complete:
    post:
      tags: [in]
      summary: Complete an open upload (write access).
      description: |
        Every file must have arrived whole, but those in drop. The files
        then take their places in the background (state completing, then
        done): each as the policy says, the same file there left as it is,
        a zip unpacked first; their rows in in.db have their SHA-256, and
        the upload is one batch of each first-level folder it fills, closed
        at once. GET the upload for the results.
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: {type: string, enum: [replace, keep, skip], description: "Empty keeps the upload's."}
                drop: {type: array, items: {type: integer}, description: "Files left out."}
      responses:
        "202":
          description: The upload, completing.
        "409":
          description: "Files have not arrived whole (`details.files`), or the upload is not open."
